services:
  - type: web
    name: internpay-web
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: internpay-db
          property: connectionString

      # Frontend build-time env vars used by the wallet and escrow flow.
      # Set these in Render if the Vite build runs in this service.
      # - key: VITE_API_BASE_URL
      #   value: https://your-api.onrender.com
      # - key: VITE_CHAIN_ID
      #   value: 0x66eee
      # - key: VITE_RPC_URL
      #   value: https://...
      # - key: VITE_EXPLORER_URL
      #   value: https://...
      # - key: VITE_ESCROW_CONTRACT_ADDRESS
      #   value: 0x...

databases:
  - name: internpay-db
    plan: free
